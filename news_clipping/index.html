<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>구글뉴스 클리핑 대시보드</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; }
        .dashboard-title { font-size: 2.5rem; font-weight: bold; margin-top: 2rem; }
        .category-card { min-width: 320px; margin-bottom: 2rem; }
        .news-title { font-weight: 500; }
        .news-date { font-size: 0.9rem; color: #888; }
        .count-badge { font-size: 1.1rem; margin-left: 0.5rem; }
        .card-body { max-height: 600px; overflow-y: auto; }
        .row.justify-content-center { display: flex; flex-wrap: nowrap; justify-content: center; }
        .col-md-4 { flex: 0 0 33.3333%; max-width: 33.3333%; }
        .update-btn { position: absolute; right: 10.5rem; top: 2.2rem; }
        .export-btn { position: absolute; right: 2rem; top: 2.2rem; }
    </style>
</head>
<body>
<div class="container position-relative">
    <div class="text-center dashboard-title">구글뉴스 클리핑 대시보드</div>
    <a href="https://github.com/allipceo/GI_Agent/actions/workflows/update-news.yml" target="_blank" class="btn btn-outline-primary update-btn" title="클릭 시 업데이트 실행 페이지로 이동합니다.">
        🔄 최신 뉴스로 수동 업데이트
    </a>
    <button class="btn btn-secondary export-btn" onclick="showExportModal()">내보내기</button>
    <div class="text-center mb-4" id="update-time">마지막 업데이트: -</div>
    <div class="text-center mb-4" style="font-size: 0.9rem; color: #6c757d;">
        <strong>업데이트 방법:</strong> 버튼 클릭 → 'Run workflow' 실행 → 1-2분 후 이 페이지 새로고침
    </div>
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="card category-card border-info">
                <div class="card-header bg-info text-white">보험중개 <span class="count-badge" id="count-보험중개">(0건)</span></div>
                <div class="card-body" id="news-cards-보험중개"></div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card category-card border-success">
                <div class="card-header bg-success text-white">신재생에너지 <span class="count-badge" id="count-신재생에너지">(0건)</span></div>
                <div class="card-body" id="news-cards-신재생에너지"></div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card category-card border-warning">
                <div class="card-header bg-warning text-white">방산 <span class="count-badge" id="count-방산">(0건)</span></div>
                <div class="card-body" id="news-cards-방산"></div>
            </div>
        </div>
    </div>
    <div class="text-center mt-4 mb-5">
        <strong id="total-count">총 수집: -건</strong>
    </div>
    <div class="text-center mb-5">
        <button class="btn btn-outline-dark" onclick="showAllNewsModal()">전체 뉴스 보기</button>
    </div>
</div>
<!-- 내보내기 모달 -->
<div class="modal fade" id="exportModal" tabindex="-1" aria-labelledby="exportModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="exportModalLabel">뉴스 내보내기</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label for="export-keyword-select" class="form-label">키워드</label>
          <select id="export-keyword-select" class="form-select" onchange="toggleCustomKeywordInput()">
            <option value="all">전체</option>
            <option value="보험중개">보험중개</option>
            <option value="신재생에너지">신재생에너지</option>
            <option value="방산">방산</option>
            <option value="custom">사용자 키워드 직접 입력</option>
          </select>
          <input type="text" id="export-keyword-input" class="form-control mt-2" placeholder="키워드 입력" style="display:none;">
        </div>
        <div class="mb-3">
          <label for="export-format" class="form-label">포맷</label>
          <select id="export-format" class="form-select">
            <option value="csv">CSV</option>
            <option value="xlsx">엑셀(xlsx)</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-primary" onclick="exportNews()">다운로드</button>
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
      </div>
    </div>
  </div>
</div>
<!-- 전체 뉴스 모달 -->
<div class="modal fade" id="allNewsModal" tabindex="-1" aria-labelledby="allNewsModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-xl">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="allNewsModalLabel">전체 클립뉴스 (누적, 분야별 3열)</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body" style="max-height:70vh; overflow-y:auto;">
        <div class="row" id="all-news-row">
          <div class="col-md-4">
            <div class="card border-info mb-3">
              <div class="card-header bg-info text-white">보험중개 <span class="count-badge" id="all-count-보험중개">(0건)</span></div>
              <div class="card-body" id="all-news-cards-보험중개"></div>
            </div>
          </div>
          <div class="col-md-4">
            <div class="card border-success mb-3">
              <div class="card-header bg-success text-white">신재생에너지 <span class="count-badge" id="all-count-신재생에너지">(0건)</span></div>
              <div class="card-body" id="all-news-cards-신재생에너지"></div>
            </div>
          </div>
          <div class="col-md-4">
            <div class="card border-warning mb-3">
              <div class="card-header bg-warning text-white">방산 <span class="count-badge" id="all-count-방산">(0건)</span></div>
              <div class="card-body" id="all-news-cards-방산"></div>
            </div>
          </div>
        </div>
        <div class="text-center mt-3">
          <button class="btn btn-secondary" id="loadMoreAllNews" style="display:none;">더보기</button>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script>
const KEYWORDS = ["보험중개", "신재생에너지", "방산"];
let newsData = [];
let exportModal;
let allNewsData = [];
let allNewsPage = 0;
const ALL_NEWS_PAGE_SIZE = 20;
let allNewsModal;
let allNewsByCategory = {};
let allNewsPageByCategory = {"보험중개":0, "신재생에너지":0, "방산":0};

document.addEventListener('DOMContentLoaded', () => {
    fetchNewsData();
    exportModal = new bootstrap.Modal(document.getElementById('exportModal'));
    allNewsModal = new bootstrap.Modal(document.getElementById('allNewsModal'));
});

function renderCards(keyword) {
    const container = document.getElementById(`news-cards-${keyword}`);
    container.innerHTML = '';
    const filtered = newsData.filter(item => item.keyword === keyword);
    document.getElementById(`count-${keyword}`).innerText = `(${filtered.length}건)`;
    if (filtered.length === 0) {
        container.innerHTML = '<div class="col"><p class="text-muted">수집된 뉴스가 없습니다.</p></div>';
        return;
    }
    filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = 'mb-3';
        card.innerHTML = `
            <div class="card border-secondary">
                <div class="card-header">${item.source || '언론사 미상'}</div>
                <div class="card-body">
                    <div class="news-title"><a href="${item.link}" target="_blank">${item.title}</a></div>
                    <div class="news-date">${item.date}</div>
                </div>
            </div>
        `;
        container.appendChild(card);
    });
}

function updateTime() {
    if (newsData.length === 0) return;
    // 최신 뉴스의 date 기준
    const dates = newsData.map(n => new Date(n.date)).filter(d => !isNaN(d));
    if (dates.length === 0) return;
    const latest = new Date(Math.max(...dates));
    const formatted = latest.toLocaleString('ko-KR', { hour12: false });
    document.getElementById('update-time').innerText = `데이터 로드 시점: ${formatted}`;
}

function fetchNewsData() {
    fetch('news_data.json')
        .then(res => res.json())
        .then(data => {
            newsData = data;
            KEYWORDS.forEach(renderCards);
            updateTime();
            document.getElementById('total-count').innerText = `총 수집: ${newsData.length}건`;
        })
        .catch(() => {
            alert('news_data.json 파일을 불러올 수 없습니다.');
        });
}

function showExportModal() {
    exportModal.show();
}

function exportNews() {
    const keyword = document.getElementById('export-keyword').value.trim();
    const format = document.getElementById('export-format').value;
    let filtered = newsData;
    if (keyword) {
        filtered = newsData.filter(item =>
            item.title.includes(keyword) ||
            item.keyword.includes(keyword) ||
            item.source.includes(keyword)
        );
    }
    if (filtered.length === 0) {
        alert('해당 키워드에 해당하는 뉴스가 없습니다.');
        return;
    }
    // 파일명 지정
    const filename = keyword ? `키워드_${keyword}.${format}` : `news_export.${format}`;
    if (format === 'csv') {
        let csv = 'date,title,link,keyword,source\n';
        filtered.forEach(item => {
            csv += `"${item.date}","${item.title.replace(/"/g, '""')}","${item.link}","${item.keyword}","${item.source}"\n`;
        });
        const blob = new Blob([csv], {type: 'text/csv'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    } else if (format === 'xlsx') {
        const ws = XLSX.utils.json_to_sheet(filtered);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, '뉴스');
        XLSX.writeFile(wb, filename);
    }
    exportModal.hide();
}

function showAllNewsModal() {
    fetch('clipnews_db.json')
        .then(res => res.json())
        .then(data => {
            allNewsData = data;
            allNewsByCategory = {"보험중개":[], "신재생에너지":[], "방산":[]};
            allNewsPageByCategory = {"보험중개":0, "신재생에너지":0, "방산":0};
            data.forEach(item => {
                if (allNewsByCategory[item.keyword]) allNewsByCategory[item.keyword].push(item);
            });
            renderAllNewsPage();
            allNewsModal.show();
        })
        .catch(() => {
            alert('clipnews_db.json 파일을 불러올 수 없습니다.');
        });
}

function renderAllNewsPage() {
    ["보험중개", "신재생에너지", "방산"].forEach(keyword => {
        const container = document.getElementById(`all-news-cards-${keyword}`);
        container.innerHTML = '';
        const page = allNewsPageByCategory[keyword];
        const start = page * ALL_NEWS_PAGE_SIZE;
        const end = start + ALL_NEWS_PAGE_SIZE;
        const items = allNewsByCategory[keyword] || [];
        const pageItems = items.slice(0, end);
        document.getElementById(`all-count-${keyword}`).innerText = `(${items.length}건)`;
        if (pageItems.length === 0) {
            container.innerHTML = '<div class="col"><p class="text-muted">수집된 뉴스가 없습니다.</p></div>';
            return;
        }
        pageItems.forEach(item => {
            const card = document.createElement('div');
            card.className = 'mb-3';
            card.innerHTML = `
                <div class="card border-secondary">
                    <div class="card-header">${item.source || '언론사 미상'}</div>
                    <div class="card-body">
                        <div class="news-title"><a href="${item.link}" target="_blank">${item.title}</a></div>
                        <div class="news-date">${item.date}</div>
                    </div>
                </div>
            `;
            container.appendChild(card);
        });
    });
    // 더보기 버튼 처리: 3개 분야 중 하나라도 더 남아있으면 표시
    const loadMoreBtn = document.getElementById('loadMoreAllNews');
    const hasMore = ["보험중개", "신재생에너지", "방산"].some(keyword => {
        const page = allNewsPageByCategory[keyword];
        const items = allNewsByCategory[keyword] || [];
        return (page+1)*ALL_NEWS_PAGE_SIZE < items.length;
    });
    if (hasMore) {
        loadMoreBtn.style.display = '';
        loadMoreBtn.onclick = () => {
            ["보험중개", "신재생에너지", "방산"].forEach(keyword => {
                const items = allNewsByCategory[keyword] || [];
                if ((allNewsPageByCategory[keyword]+1)*ALL_NEWS_PAGE_SIZE < items.length) {
                    allNewsPageByCategory[keyword]++;
                }
            });
            renderAllNewsPage();
        };
    } else {
        loadMoreBtn.style.display = 'none';
    }
}
</script>
</body>
</html>
